<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/modules/shared/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-translate="launcher.title">ETS2 TOOLBOX</title>
    <link rel="stylesheet" href="/styles/launcher.css" />
    <link rel="stylesheet" href="/styles/design_system.css" />
  </head>
  <body>
    <main class="launcher-shell" hidden>
      <section class="launcher-hero">
        <img src="/images/xlLogo.png" alt="ETS2 Tool" class="launcher-logo" />
        <span class="launcher-kicker" data-translate="launcher.kicker">Workspace Launcher</span>
        <h1 data-translate="launcher.headline">Select a workspace</h1>
        <p data-translate="launcher.summary">
          Tools for Euro Truck Simulator 2 and American Truck Simulator.
        </p>
      </section>

      <section class="launcher-grid">
        <article class="launcher-card launcher-card-editor">
          <span class="launcher-tag" data-translate="launcher.editor.tag">Save Editor</span>
          <h2 data-translate="launcher.editor.title">Save editor</h2>
          <p data-translate="launcher.editor.desc">
            Scan profiles and edit savegames, vehicles, drivers and garages.
          </p>
          <button id="openSaveEditorBtn" type="button" class="launcher-btn">
            <span data-translate="launcher.open">Open</span>
          </button>
        </article>

        <article class="launcher-card launcher-card-career">
          <span class="launcher-tag" data-translate="launcher.career.tag">Career</span>
          <h2 data-translate="launcher.career.title">Career and company</h2>
          <p data-translate="launcher.career.desc">
            Manage your virtual company, orders, fleet and finances.
          </p>
          <button id="openCareerBtn" type="button" class="launcher-btn launcher-btn-career">
            <span data-translate="launcher.open">Open</span>
          </button>
        </article>
      </section>
      <p id="launcherWorkspaceError" role="alert" data-translate="ui_refinement.workspace_failed" hidden></p>
    </main>

    <script type="module" src="/modules/launcher/main.js"></script>
  </body>
</html>
